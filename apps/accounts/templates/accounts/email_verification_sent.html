<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - MyBudget</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="display-1" style="color: #6c757d;">
                                ✉️
                            </div>
                        </div>
                        
                        <h2 class="card-title text-center mb-3">Check Your Email</h2>
                        
                        <p class="text-center text-muted mb-4">
                            We've sent a verification email to your inbox. Please click the link in the email to verify your account and complete your registration.
                        </p>
                        
                        <div class="alert alert-info" role="alert">
                            <strong>Note:</strong> The verification link will expire in 24 hours. If you don't see the email, check your spam folder.
                        </div>
                        
                        <p class="text-center mb-0">
                            <a href="{% url 'accounts_login' %}" class="btn btn-primary">Return to Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
