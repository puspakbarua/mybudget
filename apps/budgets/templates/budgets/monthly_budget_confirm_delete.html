{% extends "base.html" %}

{% block title %}Delete monthly budget{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h2">Delete monthly budget</h1>
                        <p>
                            Are you sure you want to delete the
                            <strong>{{ monthly_budget.category.name }}</strong> budget for
                            <strong>{{ monthly_budget.month|date:"F Y" }}</strong>?
                        </p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-2">
                                <button class="btn btn-danger" type="submit">Delete budget</button>
                                <a class="btn btn-outline-secondary" href="{% url 'budgets_index' %}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
