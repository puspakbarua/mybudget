{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h2 mb-4">{{ title }}</h1>
                        <form method="post">
                            {% csrf_token %}
                            {% bootstrap_form form %}
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Save monthly budget</button>
                                <a class="btn btn-outline-secondary" href="{% url 'budgets_index' %}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
