{% extends "base.html" %}

{% block title %}Log Out - MyBudget{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Log Out</h2>
                        
                        <p class="text-center text-muted mb-4">
                            Are you sure you want to log out?
                        </p>
                        
                        <div class="d-grid gap-2">
                            <form method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger">Yes, Log Me Out</button>
                            </form>
                            <a href="{% url 'profile_detail' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
