<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyBudget{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #1f513b;
            --bs-primary-rgb: 31, 81, 59;
            --bs-success: #326a50;
            --bs-success-rgb: 50, 106, 80;
            --mybudget-forest: #173b2c;
            --mybudget-green: #1f513b;
            --mybudget-leaf: #326a50;
            --mybudget-muted: #5f6d65;
            --mybudget-paper: #f6f8f4;
            --mybudget-line: #e5ebe5;
        }

        body {
            min-height: 100vh;
            color: #26372e;
            background:
                radial-gradient(ellipse at 90% 0%, rgba(183, 218, 189, 0.18), transparent 34rem),
                var(--mybudget-paper);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            min-height: calc(100vh - 56px);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            color: var(--mybudget-forest);
            letter-spacing: -0.025em;
        }

        a:not(.btn):not(.navbar-brand):not(.nav-link) {
            color: var(--mybudget-leaf);
            text-underline-offset: 0.18em;
        }

        a:not(.btn):not(.navbar-brand):not(.nav-link):hover {
            color: var(--mybudget-forest);
        }

        .navbar {
            background-color: var(--mybudget-forest) !important;
            box-shadow: 0 0.25rem 1rem rgba(23, 59, 44, 0.12);
        }

        .navbar-brand {
            font-weight: 650;
            letter-spacing: -0.025em;
        }

        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.78);
        }

        .navbar .nav-link:hover,
        .navbar .nav-link:focus {
            color: #fff;
        }

        .navbar .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.65);
        }

        .navbar .btn-outline-light:hover {
            color: var(--mybudget-forest);
            background: #f3f6df;
            border-color: #f3f6df;
        }

        .card {
            border: 1px solid var(--mybudget-line);
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 1rem 2.5rem rgba(31, 59, 44, 0.07);
        }

        .card-body {
            padding: clamp(1.5rem, 4vw, 2.25rem);
        }

        .btn {
            border-radius: 0.7rem;
            font-weight: 600;
            transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
        }

        .btn-primary {
            --bs-btn-bg: var(--mybudget-green);
            --bs-btn-border-color: var(--mybudget-green);
            --bs-btn-hover-bg: var(--mybudget-forest);
            --bs-btn-hover-border-color: var(--mybudget-forest);
            --bs-btn-active-bg: var(--mybudget-forest);
            --bs-btn-active-border-color: var(--mybudget-forest);
            --bs-btn-focus-shadow-rgb: 50, 106, 80;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .form-control,
        .form-select {
            border-color: #dbe4dc;
            border-radius: 0.65rem;
            padding: 0.7rem 0.85rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #82a991;
            box-shadow: 0 0 0 0.22rem rgba(50, 106, 80, 0.14);
        }

        .form-label {
            color: #304b3a;
            font-weight: 600;
        }

        hr {
            border-color: var(--mybudget-line);
            opacity: 1;
        }

        .profile-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
        }

        .profile-icon svg {
            width: 1.4rem;
            height: 1.4rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">MyBudget</a>
            {% if user.is_authenticated %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link profile-icon" href="{% url 'profile_detail' %}" aria-label="Your profile" title="Your profile">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="8" r="4"></circle>
                                    <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
                                </svg>
                            </a>
                        </li>
                        <li class="nav-item">
                            <form method="post" action="{% url 'profile_logout' %}">
                                {% csrf_token %}
                                <button class="nav-link btn btn-link" type="submit">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <a class="btn btn-outline-light ms-auto" href="{% url 'profile_login' %}">Log In</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
