<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBudget</title>
    <style>
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 1rem 1.5rem 0;
        }

        .profile-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            color: #495057;
            border-radius: 50%;
        }

        .profile-icon:hover,
        .profile-icon:focus-visible {
            color: #212529;
            background-color: #f1f3f5;
        }

        .profile-icon svg {
            width: 1.4rem;
            height: 1.4rem;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        {% if user.is_authenticated %}
            <a class="profile-icon" href="{% url 'profile_detail' %}" aria-label="Your profile" title="Your profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
                </svg>
            </a>
        {% endif %}
    </header>
    <h1>Welcome to MyBudget</h1>
    <p>Manage your budgets, track transactions, and stay on top of your money.</p>
    <ul>
        <li><a href="/budgets/">Budgets</a></li>
        <li><a href="/transactions/">Transactions</a></li>
    </ul>
</body>
</html>
